name: Release

# A tag such as v0.1.0 builds the portable zip on each of the four machines and attaches them to a draft release.
on:
  push:
    tags: ['v*']

jobs:
  zip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          - { os: windows-11-arm, platform: windows-arm64 }
          - { os: ubuntu-22.04, platform: linux-x64 }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
          # experimental: built here but not yet tried on a Mac by us, so a failure must not hold the release back
          - { os: macos-15, platform: macos-arm64, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: WebKitGTK for the app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: The engine, with the GPU tier
        run: cargo build --profile dist --workspace --features torc-model/gpu
      - name: The app
        run: cargo build --release --manifest-path desktop/Cargo.toml
      - name: The zip
        shell: bash
        run: |
          ext=; [[ $RUNNER_OS == Windows ]] && ext=.exe
          PY=$([[ $RUNNER_OS == Windows ]] && echo python || echo python3) VERSION=${GITHUB_REF_NAME#v} \
            bash desktop/package/pack.sh dist ${{ matrix.platform }} desktop/target/release/torc-desktop$ext \
            target/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ToRc-${{ matrix.platform }}
          path: dist/*.zip

  release:
    needs: zip
    # runs even when a zip job did not (the experimental Mac one may get no machine, which GitHub reports as a
    # cancelled job): the four required zips are checked below instead
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: A draft release with the zips and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          for p in windows-x64 windows-arm64 linux-x64 linux-arm64; do
            [[ -f dist/ToRc-$v-$p.zip ]] || { echo "the $p zip is missing: no release" >&2; exit 1; }
          done
          (cd dist && sha256sum *.zip > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --draft --title "ToRc $GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY"
