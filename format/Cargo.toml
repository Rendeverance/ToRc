[package]
name = "torc-format"
version = "0.1.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The ToRc model file format: reader, writer, GGUF converter, checker and shards"

[lib]
name = "format"

[[bin]]
name = "torc"
path = "src/bin/torc.rs"

[dependencies]
blake3 = { version = "1", features = ["rayon", "pure"] }

[lints]
workspace = true
