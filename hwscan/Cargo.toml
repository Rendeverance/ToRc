[package]
name = "hwscan"
version = "0.1.8"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hardware inventory and speed tests for the ToRc engine"

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wmi = { version = "0.18", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Kernel",
] }

[lints]
workspace = true
